<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MAAQ — Créer votre schéma tactile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#E9E1D2; --bg-raised:#F6F0E4; --bg-sunken:#DFD5C0;
    --ink:#2B211F; --ink-soft:#6E5F58; --line:#DDCFC0;
    --primary:#7A2E32; --primary-strong:#5E2126; --primary-soft:#EDD9D6; --primary-ink:#F7F1E6;
    --error:#A8502E; --error-bg:#F1DED2;
    --success:#5E7048; --success-bg:#E2E6D1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Karla',sans-serif;background:var(--bg);color:var(--ink);}
  h1{font-family:'Newsreader',serif;font-weight:500;margin:0;color:var(--ink);}
  button{font-family:'Karla',sans-serif;cursor:pointer;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:56px 28px 32px;overflow:hidden;text-align:center;">

  <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:8px;">{{stepLabel}}</div>
  <h1 style="font-size:21px;line-height:1.3;margin-bottom:10px;">{{title}}</h1>
  <p style="font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 22px;max-width:28ch;">Reliez au moins 4 points, dans l'ordre de votre choix.</p>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:26px;background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:30px;margin-bottom:18px;">
    <sc-for list="{{dots}}" as="dot" hint-placeholder-count="9">
      <button onClick="{{dot.toggle}}" aria-label="Point du schéma" style="{{dot.style}}"></button>
    </sc-for>
  </div>

  <sc-if value="{{tooShort}}" hint-placeholder-val="{{false}}">
    <div style="background:var(--error-bg);color:var(--error);font-size:13px;font-weight:600;border-radius:8px;padding:9px 14px;margin-bottom:14px;">Reliez au moins 4 points</div>
  </sc-if>
  <sc-if value="{{mismatch}}" hint-placeholder-val="{{false}}">
    <div style="background:var(--error-bg);color:var(--error);font-size:13px;font-weight:600;border-radius:8px;padding:9px 14px;margin-bottom:14px;">Les deux schémas ne correspondent pas. Recommencez.</div>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="background:var(--success-bg);color:var(--success);font-size:13px;font-weight:600;border-radius:8px;padding:9px 14px;margin-bottom:14px;">✓ Schéma enregistré</div>
  </sc-if>

  <button onClick="{{validateStep}}" style="width:100%;background:var(--primary);color:var(--primary-ink);border:none;font-weight:600;font-size:14px;border-radius:8px;padding:13px;">{{buttonLabel}}</button>
  <button onClick="{{clear}}" style="margin-top:12px;background:none;border:none;font-size:13px;font-weight:600;color:var(--ink-soft);">Effacer le tracé</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { step: 1, current: [], firstPattern: null, message: 'none' };
  }
  renderVals(){
    const s = this.state;
    const dots = [];
    for (let i = 0; i < 9; i++) {
      const selected = s.current.indexOf(i) !== -1;
      dots.push({
        style: "width:16px;height:16px;border-radius:50%;border:2px solid " + (selected ? 'var(--primary)' : 'var(--ink-soft)') + ";background:" + (selected ? 'var(--primary)' : 'transparent') + ";padding:0;",
        toggle: () => {
          const cur = this.state.current;
          if (cur.indexOf(i) === -1) this.setState({ current: cur.concat([i]), message: 'none' });
        },
      });
    }
    return {
      stepLabel: 'Étape ' + s.step + ' sur 2',
      title: s.step === 1 ? 'Dessinez votre schéma' : 'Confirmez votre schéma',
      dots: dots,
      tooShort: s.message === 'short',
      mismatch: s.message === 'mismatch',
      done: s.message === 'done',
      buttonLabel: s.step === 1 ? 'Continuer' : 'Confirmer',
      clear: () => this.setState({ current: [] }),
      validateStep: () => {
        if (s.current.length < 4) { this.setState({ message: 'short' }); return; }
        if (s.step === 1) {
          this.setState({ step: 2, firstPattern: s.current.slice(), current: [], message: 'none' });
        } else {
          const same = s.firstPattern.length === s.current.length && s.firstPattern.every((v, idx) => v === s.current[idx]);
          if (same) this.setState({ message: 'done' });
          else this.setState({ step: 1, current: [], firstPattern: null, message: 'mismatch' });
        }
      },
    };
  }
}
</script>
</body>
</html>
