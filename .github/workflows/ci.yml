name: CI

on:
  push:
    branches: [test, master, prod]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maaq
          POSTGRES_PASSWORD: maaq
          POSTGRES_DB: maaq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maaq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Les tests utilisent cette base au lieu de la base embarquée.
      TEST_DATABASE_URL: postgres://maaq:maaq@localhost:5432/maaq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
